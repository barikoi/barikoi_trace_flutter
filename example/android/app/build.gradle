plugins {
    id "com.android.application"
    id "kotlin-android"
    // Must come after the Android and Kotlin plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader -> localProperties.load(reader) }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0"

android {
    namespace = "com.barikoi.barikoitrace.flutter.example"
    compileSdk = 35
    ndkVersion = flutter.ndkVersion

    compileOptions {
        // REQUIRED, and not inherited from the plugin: core library desugaring
        // is not transitive. The native SDK models the daily tracking window
        // with java.time.LocalTime, which does not exist below API 26 — so at
        // minSdk 24 the application module has to desugar it too. Without this
        // the app builds and then crashes with NoClassDefFoundError:
        // java.time.LocalTime the first time a TraceMode is constructed.
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.barikoi.barikoitrace.flutter.example"
        // The native SDK's own floor. It cannot go lower.
        minSdk = 24
        targetSdk = 35
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    buildTypes {
        release {
            // Debug signing so `flutter run --release` works out of the box.
            // Replace with your own signing config before shipping anything.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}

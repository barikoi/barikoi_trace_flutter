# AndroidX is mandatory, not optional: the Flutter embedding and the native
# SDK (androidx.security, Room, WorkManager, DataStore) are all AndroidX. The
# Flutter migrator rewrote this file and dropped these two lines, which is what
# produced "Configuration :app:debugRuntimeClasspath contains AndroidX
# dependencies, but the android.useAndroidX property is not enabled".
android.useAndroidX=true
# Nothing in this dependency graph is a pre-AndroidX support-library artifact,
# so the Jetifier rewriter is pure build-time cost.
android.enableJetifier=false

org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError

# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

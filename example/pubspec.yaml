name: barikoi_trace_flutter_example
description: Demo app for the barikoi_trace_flutter plugin — permissions, sign-in, tracking, live fixes and the SDK log console.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # The plugin under test, from the parent directory. Nothing is fetched from
  # pub.dev, so a change to lib/ shows up on the next `flutter run`.
  barikoi_trace_flutter:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
